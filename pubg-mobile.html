<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Mobile UC Top Up - XRIYAN HUB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0f172a; color: #ffffff; padding-bottom: 50px; }
        header { background: #1e293b; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #38bdf8; }
        .back-btn { color: #38bdf8; text-decoration: none; font-weight: bold; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .banner { width: 100%; height: 120px; background: linear-gradient(135deg, #f6d365, #fda085); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #000; }
        .section-title { font-size: 16px; margin-bottom: 12px; color: #38bdf8; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px; }
        .card { background: #1e293b; border: 2px solid #334155; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; }
        .card:hover { border-color: #38bdf8; background: #0f2942; }
        .card h4 { font-size: 15px; margin-bottom: 5px; }
        .card p { font-size: 14px; color: #38bdf8; font-weight: bold; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; }
        .btn-submit { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← Home</a>
        <h1>PUBG Mobile UC</h1>
        <div></div>
    </header>

    <div class="container">
        <div class="banner">🎮 PUBG MOBILE 🎮</div>

        <h3 class="section-title">১. প্যাকেজ নির্বাচন করুন</h3>
        <div class="grid">
            <div class="card"><h4>60 UC</h4><p>90 BDT</p></div>
            <div class="card"><h4>325 UC</h4><p>450 BDT</p></div>
            <div class="card"><h4>660 UC</h4><p>900 BDT</p></div>
            <div class="card"><h4>Royale Pass</h4><p>850 BDT</p></div>
        </div>

        <h3 class="section-title">২. প্লেয়ার তথ্য দিন</h3>
        <div class="form-group">
            <label>Player ID (UID):</label>
            <input type="number" placeholder="Ex: 5123456789">
        </div>
        <div class="form-group">
            <label>আপনার হোয়াটসঅ্যাপ নম্বর:</label>
            <input type="text" placeholder="Ex: 01700000000">
        </div>
        <button class="btn-submit">BUY NOW (অর্ডার করুন)</button>
    </div>

</body>
</html>
