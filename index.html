<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRIYAN HUB - Top Up Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            padding-bottom: 40px;
        }

        /* Header / Navbar */
        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid #38bdf8;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            color: #38bdf8;
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* Container */
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #f8fafc;
            border-left: 4px solid #38bdf8;
            padding-left: 10px;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        /* Game Card */
        .game-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
            border-color: #38bdf8;
        }

        .game-icon {
            width: 70px;
            height: 70px;
            background-color: #334155;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .game-title {
            font-size: 14px;
            font-weight: 600;
        }

        /* Footer */
        footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>

    <header>
