<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Top Up - XRIYAN HUB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            padding-bottom: 50px;
        }

        /* Top Header Navigation */
        header {
            background: #1e293b;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #38bdf8;
        }

        .back-btn {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        header h1 {
            font-size: 18px;
            color: #fff;
        }

        /* Main Container */
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .banner {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
        }

        .section-title {
            font-size: 16px;
            margin-bottom: 12px;
            color: #38bdf8;
        }

        /* Option Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover, .card.selected {
            border-color: #38bdf8;
            background: #0f2942;
        }

        .card h4 {
            font-size: 15px;
            margin-bottom: 5px;
            color: #fff;
        }

        .card p {
            font-size: 14px;
            color: #38bdf8;
            font-weight: bold;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #38bdf8;
        }

        /* Order Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background: #0284c7;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← Home</a>
        <h1>Free Fire Top Up</h1>
        <div></div>
    </header>

    <div class="container">
        
        <div class="banner">
            🔥 FREE FIRE 🔥
        </div>

        <!-- Section 1: Select Pack -->
        <h3 class="section-title">১. প্যাকেজ নির্বাচন করুন</h3>
        <div class="grid">
            <div class="card">
                <h4>115 Diamonds</h4>
                <p>80 BDT</p>
            </div>
            <div class="card">
                <h4>240 Diamonds</h4>
                <p>160 BDT</p>
            </div>
            <div class="card">
                <h4>610 Diamonds</h4>
                <p>420 BDT</p>
            </div>
            <div class="card">
                <h4>Weekly Membership</h4>
                <p>165 BDT</p>
            </div>
            <div class="card">
                <h4>Monthly Membership</h4>
                <p>750 BDT</p>
            </div>
            <div class="card">
                <h4>Level Up Pass</h4>
                <p>190 BDT</p>
            </div>
        </div>

        <!-- Section 2: Player Info -->
        <h3 class="section-title">২. প্লেয়ার তথ্য দিন</h3>
        <div class="form-group">
            <label for="player-id">Player Player ID (UID):</label>
            <input type="number" id="player-id" placeholder="Ex: 123456789">
        </div>

        <div class="form-group">
            <label for="whatsapp">আপনার হোয়াটসঅ্যাপ নম্বর:</label>
            <input type="text" id="whatsapp" placeholder="Ex: 01700000000">
        </div>

        <!-- Submit Button -->
        <button class="btn-submit">BUY NOW (অর্ডার করুন)</button>

    </div>

</body>
  </html>
